name: blog-x-secondary

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${BLOG_X_POSTGRES_DB}
      POSTGRES_USER: ${BLOG_X_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BLOG_X_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 1200m
    cpus: "1.0"
    pids_limit: 256

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        BLOG_X_REVISION: ${BLOG_X_REVISION}
    image: ${BLOG_X_API_IMAGE:-blog-x-api-secondary:${BLOG_X_REVISION}}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${BLOG_X_POSTGRES_USER}:${BLOG_X_POSTGRES_PASSWORD}@postgres:5432/${BLOG_X_POSTGRES_DB}
      PUBLIC_ORIGIN: https://huajieyu001.top
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      MEDIA_ROOT: /var/lib/blog-x/media
    command: ["corepack", "pnpm", "--filter", "@blog-x/api", "dev"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - media-data:/var/lib/blog-x/media
    networks: [internal, ingress]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    mem_limit: 1400m
    cpus: "1.0"
    pids_limit: 256

volumes:
  postgres-data:
  media-data:

networks:
  internal:
    internal: true
  ingress:
    driver: bridge
