<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>花解语Coding · 网站维护中</title>
  <meta name="description" content="花解语Coding 正在进行网站维护与升级。">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --panel: rgba(255, 255, 255, 0.86);
      --text: #172033;
      --muted: #667085;
      --line: rgba(15, 23, 42, 0.1);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #08111f;
        --panel: rgba(15, 23, 42, 0.86);
        --text: #f8fafc;
        --muted: #a6b0c0;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.14);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, var(--accent-soft), transparent 32rem),
        radial-gradient(circle at 90% 85%, rgba(14, 165, 233, 0.09), transparent 28rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(92%, 720px);
      margin: auto;
      padding: 48px 0 32px;
    }

    .card {
      padding: clamp(36px, 8vw, 72px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      box-shadow: 0 0 0 5px var(--accent-soft);
    }

    h1 {
      margin: 26px 0 16px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto;
      max-width: 32rem;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 18px);
      line-height: 1.8;
    }

    .signature {
      margin-top: 28px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      padding: 22px 20px 28px;
      text-align: center;
      font-size: 13px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 160ms ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 520px) {
      main {
        width: calc(100% - 32px);
        padding-top: 24px;
      }

      .card {
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="maintenance-title">
      <span class="badge">MAINTENANCE</span>
      <h1 id="maintenance-title">网站维护中</h1>
      <p>我们正在整理内容并升级博客系统，完成后将重新开放。感谢你的理解与耐心等待。</p>
      <div class="signature">花解语Coding</div>
    </section>
  </main>

  <footer>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">黔ICP备2023015906号</a>
  </footer>
</body>
</html>
