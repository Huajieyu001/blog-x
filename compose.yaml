services:
  postgres:
    image: postgres:18-alpine
    pull_policy: never
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${BLOG_X_POSTGRES_DB:-blog_x}
      POSTGRES_USER: ${BLOG_X_POSTGRES_USER:-blog_x}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLOG_X_POSTGRES_USER:-blog_x} -d ${BLOG_X_POSTGRES_DB:-blog_x}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      private:
        ipv4_address: 172.30.0.4

  api:
    image: ${BLOG_X_API_IMAGE:-blog-x-api-local}
    pull_policy: never
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: none
    environment:
      DATABASE_URL: postgres://${BLOG_X_POSTGRES_USER:-blog_x}@postgres:5432/${BLOG_X_POSTGRES_DB:-blog_x}
      PUBLIC_ORIGIN: ${BLOG_X_PUBLIC_ORIGIN:-http://127.0.0.1:3100}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      TRUSTED_PROXY_CIDRS: 172.30.0.3/32
      MEDIA_ROOT: /var/lib/blog-x/media
    networks:
      private:
        ipv4_address: 172.30.0.2
    volumes:
      - media-data:/var/lib/blog-x/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    image: ${BLOG_X_WEB_IMAGE:-blog-x-web-local}
    pull_policy: never
    init: true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: none
      args:
        PUBLIC_ORIGIN: ${BLOG_X_PUBLIC_ORIGIN:-http://127.0.0.1:3100}
    environment:
      INTERNAL_API_ORIGIN: http://api:3001
      PUBLIC_ORIGIN: ${BLOG_X_PUBLIC_ORIGIN:-http://127.0.0.1:3100}
    networks:
      private:
        ipv4_address: 172.30.0.3
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BLOG_X_WEB_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  media-data:

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/29
